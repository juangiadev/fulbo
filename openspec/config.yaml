schema: spec-driven

context: |
  Tech stack: NestJS 11 + TypeORM + Postgres backend; React 19 + Vite 7 frontend; shared TypeScript source package.
  Architecture: Split backend/frontend packages from repo root; backend domain modules under backend/src; frontend routes in App.tsx with ProtectedRoute + AppShell.
  Testing: Backend Jest unit + e2e available; frontend has no test runner configured.
  Style: TypeScript strict mode on frontend; ESLint on both packages; Prettier enforced on backend.

strict_tdd: true

testing:
  detected: 2026-06-01
  runner:
    command: pnpm -C backend run test
    framework: Jest
  layers:
    unit:
      available: true
      tool: Jest
    integration:
      available: true
      tool: Supertest via Nest test:e2e
    e2e:
      available: true
      tool: Jest e2e config
  coverage:
    available: true
    command: pnpm -C backend run test:cov
  quality:
    linter:
      available: true
      command: pnpm -C backend run lint && pnpm -C frontend run lint
    type_checker:
      available: true
      command: pnpm -C frontend run build
    formatter:
      available: true
      command: pnpm -C backend run format

rules:
  proposal:
    - Respect the split backend/frontend package layout; never assume a root JS workspace.
    - Call out shared/ impacts explicitly because frontend imports shared source directly.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
    - State whether the change affects backend, frontend, shared, or multiple packages.
  design:
    - Document package boundaries, API base path /api, and auth/dev-bypass implications when relevant.
    - Explain database migration impact for backend changes.
  tasks:
    - Keep tasks scoped to one package unless a cross-package slice is required.
    - Include test tasks before implementation tasks when backend behavior changes.
  apply:
    - Follow existing NestJS domain-module and React route/state patterns.
    - Do not build after changes.
    tdd: true
    test_command: pnpm -C backend run test
  verify:
    test_command: pnpm -C backend run test && pnpm -C backend run test:e2e
    build_command: pnpm -C frontend run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
